{"name":"Check GO Fest News","on":{"schedule":[{"cron":"0 * * * *"}],"workflow_dispatch":{}},"jobs":{"check":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.11"}},{"name":"Install dependencies","run":"pip install -r requirements.txt && playwright install --with-deps chromium"},{"name":"Run script","env":{"DISCORD_WEBHOOK_URL":"${{ secrets.DISCORD_WEBHOOK_URL }}"},"run":"python main.py"},{"name":"Commit notified URLs","run":"git config user.name 'github-actions[bot]' && git config user.email 'github-actions[bot]@users.noreply.github.com' && git add notified_urls.txt && (git diff --staged --quiet || (git commit -m 'Update notified_urls.txt' && git push))"}]}}}
